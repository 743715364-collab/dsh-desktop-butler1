<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌面管家</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;}
  #c{display:block;width:100vw;height:100vh;}
  #err{display:none;position:fixed;inset:0;padding:20px;color:#fff;background:#2a0707;
       font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow:auto;z-index:9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
"use strict";

/* 桌面管家 — 一个核心 + 三层环绕的简化全息体
   WebGL2 · 零依赖 · 单文件
   场景 -> HDR 缓冲 -> 辉光 -> 合成(色差/颗粒/暗角) */

var canvas = document.getElementById("c");
var errBox = document.getElementById("err");

var gl = canvas.getContext("webgl2", {
  alpha: true, antialias: false, depth: false, stencil: false,
  premultipliedAlpha: false, powerPreference: "high-performance"
});
if (!gl) {
  errBox.style.display = "block";
  errBox.textContent = "This browser has no WebGL2 support. Open the file with a recent Chrome / Edge / Firefox.";
  throw new Error("WebGL2 unavailable");
}

/* ------------------------------------------------------------ shader utils */
function compile(type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    var numbered = src.split("\n").map(function (l, i) {
      return String(i + 1).padStart(3, " ") + "| " + l;
    }).join("\n");
    throw new Error("SHADER ERROR\n" + gl.getShaderInfoLog(s) + "\n" + numbered);
  }
  return s;
}
function program(vsSrc, fsSrc) {
  var p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error("LINK ERROR\n" + gl.getProgramInfoLog(p));
  }
  var u = {};
  for (var i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) {
    var info = gl.getActiveUniform(p, i);
    u[info.name] = gl.getUniformLocation(p, info.name);
  }
  return { p: p, u: u };
}

var VS = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

/* ------------------------------------------------------------ 场景 */
var FS_SCENE = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;

uniform vec2  uRes;
uniform vec3  uCam;
uniform float uTime;
uniform float uRingTime;

#define TAU 6.28318530718
const float FOCAL = 0.315;
const vec3  GOLD  = vec3(1.0, 0.66, 0.24);

/* 一层圆环：平面与视线求交，得到细亮带 + 虚线 + 一颗绕行的亮点 */
vec3 ring(vec3 ro, vec3 rd, vec3 n, float R, float thick,
          float spin, float dashFreq, float duty)
{
  float dn = dot(rd, n);
  if (abs(dn) < 0.015) return vec3(0.0);
  float t = -dot(ro, n)/dn;
  if (t < 0.05) return vec3(0.0);

  vec3  p = ro + rd*t;
  float r = length(p);

  vec3 ax = abs(n.y) < 0.9 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
  vec3 u  = normalize(cross(n, ax));
  vec3 v  = cross(n, u);
  float ang = atan(dot(p,v), dot(p,u))/TAU + 0.5;   // 0..1

  float a   = fract(ang + spin);
  float seg = fract(a*dashFreq);
  float dash = smoothstep(0.0, 0.04, seg) * (1.0 - smoothstep(duty, duty + 0.04, seg));

  // Fragmented-data mask: coarse blocks + fine chips, with different warps.
  float g = fract(ang + spin*0.7);
  float gw = fract(g + 0.050*sin(g*TAU*2.7) + 0.024*sin(g*TAU*8.3 + 1.3));
  float gi = floor(gw * 64.0);
  float gf = fract(gw * 64.0);
  float r0 = fract(sin(gi*12.9898 + 4.1) * 43758.5453);
  float r1 = fract(sin(gi*78.233 + 9.7) * 43758.5453);
  float r2 = fract(sin(gi*39.425 + 21.3) * 43758.5453);
  float r3 = fract(sin(gi*91.733 + 63.1) * 43758.5453);
  float r4 = fract(sin(gi*57.117 + 83.7) * 43758.5453);
  // Each coarse block sits at a different radial height: the ring becomes a
  // staggered stack of fragments instead of a flat band.
  // Break each ring into 2 or 3 major arcs, with a slight radial offset per
  // piece. The inner edge of each piece stays regular; the pieces sit staggered.
  float pieces = R < 0.40 ? 2.0 : R < 0.58 ? 3.0 : 2.0;
  float piecePhase = fract(R * 7.31 + 0.17);
  // Warp the angular domain so the break points are not evenly spaced.
  float warp = 0.030*sin(ang*TAU*2.3 + R*11.0) + 0.012*sin(ang*TAU*7.1 + R*29.0);
  float pa = fract(ang + piecePhase + warp);
  float sector = pa * pieces;
  float pieceId = floor(sector);
  float local = fract(sector);
  float gd = min(local, 1.0 - local);
  // Narrow, hard-edged split; no cap line is drawn at the cut faces.
  float edgeGap = 1.0 - smoothstep(0.0315, 0.0330, gd);
  float po = fract(sin(pieceId*37.17 + pieces*11.3 + R*91.7) * 43758.5453);
  float pieceOff = (po - 0.5) * R * 0.10;

  // Keep the inner circumference regular; stagger only the outer half.
  float d0 = (r - R)/thick;
  float taper = smoothstep(-0.62, 0.18, d0);
  float off = pieceOff + (r4 - 0.5) * thick * 1.6 * taper;
  float d = (r - R - off)/thick;
  float band = exp(-d*d);
  if (band < 0.001) return vec3(0.0);

  float ns = 0.11 + r0*0.38;
  float nw = 0.045 + r1*0.115;
  float slot = smoothstep(ns, ns+0.010, gf) * (1.0 - smoothstep(ns+nw, ns+nw+0.010, gf));
  slot *= step(0.06, r3);
  float depth = 0.10 + r2*0.62;
  float notchA = slot * step(1.0 - 2.0*depth, d);

  float gw2 = fract(g + 0.030*sin(g*TAU*9.1) + 0.014*sin(g*TAU*23.7));
  float gj = floor(gw2 * 107.0);
  float gf2 = fract(gw2 * 107.0);
  float q0 = fract(sin(gj*12.9898 + 4.1) * 43758.5453);
  float q1 = fract(sin(gj*78.233 + 9.7) * 43758.5453);
  float q2 = fract(sin(gj*39.425 + 21.3) * 43758.5453);
  float qs = 0.16 + q0*0.44;
  float qw = 0.035 + q1*0.085;
  float chip = smoothstep(qs, qs+0.008, gf2) * (1.0 - smoothstep(qs+qw, qs+qw+0.008, gf2));
  chip *= step(0.22, q2);
  float chipDepth = 0.45 + q1*0.30;
  float notchB = chip * step(1.0 - 2.0*chipDepth, d);

  float notch = max(notchA, notchB);
  float keep = (1.0 - notch) * (1.0 - edgeGap);


  float body = smoothstep(1.15, 0.82, abs(d));
  float edge = exp(-pow((abs(d)-0.92)/0.075, 2.0));
  vec3 c  = GOLD * band * (dash*0.34 + 0.04);
  c += GOLD * body * (dash*0.10 + 0.06);
  c += vec3(1.0,0.86,0.58) * edge * 0.28;
  float innerRim = exp(-pow((d + 0.94)/0.055, 2.0));
  c += vec3(1.0,0.90,0.66) * innerRim * 0.16;
  c *= (0.72 + 0.28*r3) * (0.80 + 0.20*(off/thick*0.5 + 0.5));
  return c * keep;
}

vec3 normalOf(float tilt, float azim){
  return normalize(vec3(sin(tilt)*cos(azim), cos(tilt), sin(tilt)*sin(azim)));
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes)/uRes.y;
  vec3 ro = uCam;
  vec3 rd = normalize(vec3(uv.x*FOCAL, uv.y*FOCAL, -1.0));
  float t = uTime;

  /* 背景：深色 + 一点暖雾 */
  vec3 col = vec3(0.0);

  /* 三层环绕：倾斜角、半径、转速都不同 */
  col += ring(ro, rd, normalOf(1.02, 0.35 + t*0.16), 0.52, 0.0380, uRingTime*0.55, 1.0, 1.05);
  col += ring(ro, rd, normalOf(1.50, 2.10 - t*0.11), 0.82, 0.0480, uRingTime*0.33, 1.0, 1.05);
  col += ring(ro, rd, normalOf(0.55, 4.05 + t*0.09), 1.12, 0.0580, uRingTime*0.21, 1.0, 1.05);

  /* 核心：实心光球 + 脉冲 + 白热点 */
  vec2 sc = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  float rr = length(sc);
  float pulse = 1.0 + 0.07*sin(t*2.1);
  float R0 = 0.105 * pulse;

  float ball = smoothstep(R0, R0*0.55, rr);
  col += vec3(1.0,0.72,0.32) * ball * 0.60;
  col += vec3(1.0,0.86,0.60) * smoothstep(R0*2.4, R0*0.8, rr) * 0.22;
  col += vec3(1.0,0.97,0.92) * exp(-rr*rr*4200.0) * 1.0 * pulse;
  col += vec3(1.0,0.62,0.22) * exp(-rr*4.0) * 0.20;

  outColor = vec4(col, clamp(max(col.r, max(col.g, col.b)), 0.0, 1.0));
}`;

/* ------------------------------------------------------------ 后期 */
var FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 outColor;
uniform sampler2D uTex; uniform float uThresh;
void main(){
  vec4 t = texture(uTex, vUv);
  vec3 c = t.rgb;
  float l = max(max(c.r, c.g), c.b);
  float m = smoothstep(uThresh, uThresh + 0.5, l);
  outColor = vec4(c * m, t.a * m);
}`;

var FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 outColor;
uniform sampler2D uTex; uniform vec2 uDir;
void main(){
  vec4 s  = texture(uTex, vUv) * 0.2270;
  s += (texture(uTex, vUv + uDir*1.0) + texture(uTex, vUv - uDir*1.0)) * 0.1945;
  s += (texture(uTex, vUv + uDir*2.0) + texture(uTex, vUv - uDir*2.0)) * 0.1216;
  s += (texture(uTex, vUv + uDir*3.0) + texture(uTex, vUv - uDir*3.0)) * 0.0540;
  s += (texture(uTex, vUv + uDir*4.0) + texture(uTex, vUv - uDir*4.0)) * 0.0162;
  outColor = vec4(s.rgb, s.a);
}`;

var FS_COMP = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 outColor;
uniform sampler2D uScene, uBloomA, uBloomB;
uniform vec2 uRes; uniform float uTime;

float hash21(vec2 p){
  vec3 p3 = fract(vec3(p.xyx)*0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y)*p3.z);
}
void main(){
  vec2 cc = vUv - 0.5;
  float r2 = dot(cc, cc);
  vec2 uv = vUv + cc*r2*0.030;                 // 轻微桶形

  float ca = 0.0010 + 0.0035*r2;               // 色差
  vec3 s;
  s.r = texture(uScene, uv + cc*ca*1.6).r;
  s.g = texture(uScene, uv).g;
  s.b = texture(uScene, uv - cc*ca*1.6).b;

  vec3 col = s.rgb + texture(uBloomA, uv).rgb*0.42 + texture(uBloomB, uv).rgb*0.22;
  float a = texture(uScene, uv).a + texture(uBloomA, uv).a*0.42 + texture(uBloomB, uv).a*0.22;
  col = 1.0 - exp(-col*1.20);                  // 色调映射
  col = mix(vec3(dot(col, vec3(0.299,0.587,0.114))), col, 1.22);
  col = pow(max(col, 0.0), vec3(1.10));
  col *= vec3(1.03, 1.00, 0.94);
  col += (hash21(gl_FragCoord.xy + fract(uTime)*977.0) - 0.5)*0.035;
  outColor = vec4(max(col, 0.0), clamp(a, 0.0, 1.0));
}`;

/* ------------------------------------------------------------ 编译 */
var progScene, progBright, progBlur, progComp;
try {
  progScene  = program(VS, FS_SCENE);
  progBright = program(VS, FS_BRIGHT);
  progBlur   = program(VS, FS_BLUR);
  progComp   = program(VS, FS_COMP);
} catch (e) {
  errBox.style.display = "block";
  errBox.textContent = String(e.message || e);
  throw e;
}

var quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
var quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

/* ------------------------------------------------------------ 渲染目标 */
var hdr = !!gl.getExtension("EXT_color_buffer_float");
var TEX_FMT  = hdr ? gl.RGBA16F : gl.RGBA8;
var TEX_TYPE = hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

function makeTarget(w, h) {
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, TEX_FMT, w, h, 0, gl.RGBA, TEX_TYPE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  var fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex: tex, fbo: fbo, w: w, h: h };
}

var W = 2, H = 2, sceneT, bA, bAt, bB, bBt;

function alloc(w, h) {
  [sceneT, bA, bAt, bB, bBt].forEach(function (t) {
    if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }
  });
  sceneT = makeTarget(w, h);
  bA  = makeTarget(Math.max(2, w >> 2), Math.max(2, h >> 2));
  bAt = makeTarget(Math.max(2, w >> 2), Math.max(2, h >> 2));
  bB  = makeTarget(Math.max(2, w >> 3), Math.max(2, h >> 3));
  bBt = makeTarget(Math.max(2, w >> 3), Math.max(2, h >> 3));
}

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.max(2, Math.round(window.innerWidth * dpr));
  var h = Math.max(2, Math.round(window.innerHeight * dpr));
  if (w === W && h === H) return;
  W = w; H = h;
  canvas.width = W; canvas.height = H;
  alloc(W, H);
}
window.addEventListener("resize", resize);
resize();

/* ------------------------------------------------------------ 绘制 */
function bind(p) { gl.useProgram(p.p); return p.u; }
function tex(unit, t, loc) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.uniform1i(loc, unit);
}
function blur(src, dst, dx, dy) {
  var u = bind(progBlur);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, dst.w, dst.h);
  tex(0, src.tex, u.uTex);
  gl.uniform2f(u.uDir, dx/src.w, dy/src.h);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

var tAcc = parseFloat(new URLSearchParams(location.search).get("t0") || "0") || 0;
var ringTime = 0;
var ringOffset = 0;
var ringPaused = new URLSearchParams(location.search).get("paused") === "1";
window.ringControl = {
  setPaused: function (v) { ringPaused = Boolean(v); },
  setSpin: function (v) { ringOffset = Number(v) || 0; },
  getSpin: function () { return ringOffset; },
  isPaused: function () { return ringPaused; }
};
var last = performance.now();

function render(t, rt) {
  /* 场景 */
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneT.fbo);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  var u = bind(progScene);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform3f(u.uCam, Math.sin(t*0.21)*0.030, Math.cos(t*0.17)*0.022, 3.05);
  gl.uniform1f(u.uTime, t);
  gl.uniform1f(u.uRingTime, rt);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  /* 辉光 */
  var ub = bind(progBright);
  gl.bindFramebuffer(gl.FRAMEBUFFER, bA.fbo);
  gl.viewport(0, 0, bA.w, bA.h);
  tex(0, sceneT.tex, ub.uTex);
  gl.uniform1f(ub.uThresh, 0.74);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  blur(bA, bAt, 1, 0);  blur(bAt, bA, 0, 1);
  blur(bA, bB, 0.6, 0); blur(bB, bBt, 0, 0.6); blur(bBt, bB, 0.7, 0);

  /* 合成 */
  var uc = bind(progComp);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  tex(0, sceneT.tex, uc.uScene);
  tex(1, bA.tex, uc.uBloomA);
  tex(2, bB.tex, uc.uBloomB);
  gl.uniform2f(uc.uRes, W, H);
  gl.uniform1f(uc.uTime, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function loop(now) {
  var dt = (now - last)/1000;
  last = now;
  if (dt > 0.2) dt = 0.2;
  tAcc += dt;
  if (!ringPaused) ringTime += dt;
  render(tAcc, ringTime + ringOffset);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
